[package]
name = "xtools-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Linux 桌面悬浮工具箱 (时间戳 / JSON / 翻译)"

[package.metadata.generate-rpm]
name = "xtools"
summary = "Linux 桌面悬浮工具箱"
assets = [
    { source = "../../target/release/xtools-host", dest = "/usr/bin/xtools-host", mode = "755" },
    { source = "../../target/release/xtools-time", dest = "/usr/bin/xtools-time", mode = "755" },
    { source = "../../target/release/xtools-json", dest = "/usr/bin/xtools-json", mode = "755" },
    { source = "../../target/release/xtools-trans", dest = "/usr/bin/xtools-trans", mode = "755" },
    { source = "../../xtools.desktop", dest = "/usr/share/applications/xtools.desktop", mode = "644" },
    { source = "../../xtools.svg", dest = "/usr/share/icons/hicolor/scalable/apps/xtools.svg", mode = "644" },
]

[package.metadata.deb]
name = "xtools"
maintainer = "xtools developers"
copyright = "2026 xtools contributors"
license-file = ["../../LICENSE", "4"]
extended-description = "Linux 桌面悬浮工具箱 (时间戳 / JSON / 翻译)"
section = "utils"
priority = "optional"
depends = "$auto, libgtk-4-1, libgtk4-layer-shell-0"
assets = [
    ["../../target/release/xtools-host", "usr/bin/xtools-host", "755"],
    ["../../target/release/xtools-time", "usr/bin/xtools-time", "755"],
    ["../../target/release/xtools-json", "usr/bin/xtools-json", "755"],
    ["../../target/release/xtools-trans", "usr/bin/xtools-trans", "755"],
    ["../../xtools.desktop", "usr/share/applications/xtools.desktop", "644"],
    ["../../xtools.svg", "usr/share/icons/hicolor/scalable/apps/xtools.svg", "644"],
]

[dependencies]
xtools-ui = { workspace = true }
resvg = "0.47.0"
tiny-skia = "0.12.0"
usvg = "0.47.0"
[target.'cfg(unix)'.dependencies]
gtk4 = { version = "0.11.4", features = ["v4_12"] }
gtk4-layer-shell = { version = "0.8.1", features = ["v1_3"] }
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
