[package]
name = "xtools-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
[features]
default = ["slint-chrome"]
slint-chrome = ["dep:slint", "dep:arboard", "dep:parking_lot"]
x11-skip-taskbar = ["dep:x11rb"]
[dependencies]
arboard = { version = "3.4.1", optional = true }
parking_lot = { version = "0.12.5", optional = true }
slint = { version = "1.17.1", optional = true }
x11rb = { version = "0.13.2", optional = true }
