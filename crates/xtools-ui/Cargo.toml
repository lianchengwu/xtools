[package]
name = "xtools-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
[features]
default = ["slint-chrome"]
slint-chrome = ["dep:slint", "dep:arboard", "dep:parking_lot"]
x11-skip-taskbar = ["dep:x11rb"]
[dependencies]
arboard = { version = "3.4.1", optional = true }
parking_lot = { version = "0.12.5", optional = true }
slint = { version = "1.17.1", optional = true }
x11rb = { version = "0.13.2", optional = true }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }
