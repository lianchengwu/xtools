name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-packages:
    name: Build Linux RPM & DEB Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libfontconfig1-dev \
            libwayland-dev \
            wayland-protocols \
            gobject-introspection \
            valac \
            meson \
            ninja-build \
            rpm \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Install gtk4-layer-shell
        run: |
          git clone --depth 1 https://github.com/wmww/gtk4-layer-shell.git
          cd gtk4-layer-shell
          meson setup build --prefix=/usr \
            -Dexamples=false \
            -Ddocs=false \
            -Dtests=false \
            -Dvapi=false \
            -Dintrospection=false
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig
          cd ..
          rm -rf gtk4-layer-shell

      - name: Install Packaging Tools (cargo-deb & cargo-generate-rpm)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Build Release Binaries
        run: cargo build --release

      - name: Extract Version
        id: get_version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="0.1.0"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package DEB
        run: |
          mkdir -p target/dist
          cargo deb -p xtools-host --no-build --output target/dist/xtools_${{ steps.get_version.outputs.VERSION }}_amd64.deb

      - name: Package RPM
        run: |
          mkdir -p target/dist
          cargo generate-rpm -p crates/xtools-host -o target/dist/xtools-${{ steps.get_version.outputs.VERSION }}-1.x86_64.rpm

      - name: Generate Checksums
        run: |
          cd target/dist
          sha256sum *.deb *.rpm > SHA256SUMS.txt
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/dist/*.deb
            target/dist/*.rpm
            target/dist/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
