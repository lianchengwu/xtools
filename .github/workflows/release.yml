name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux RPM & DEB Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libfontconfig1-dev \
            libwayland-dev \
            wayland-protocols \
            gobject-introspection \
            valac \
            meson \
            ninja-build \
            rpm \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Install gtk4-layer-shell
        run: |
          git clone --depth 1 https://github.com/wmww/gtk4-layer-shell.git
          cd gtk4-layer-shell
          meson setup build --prefix=/usr \
            -Dexamples=false \
            -Ddocs=false \
            -Dtests=false \
            -Dvapi=false \
            -Dintrospection=false
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig
          cd ..
          rm -rf gtk4-layer-shell

      - name: Install Packaging Tools (cargo-deb & cargo-generate-rpm)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Build Release Binaries
        run: cargo build --release

      - name: Extract Version
        id: get_version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="0.2.4"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package DEB & RPM
        run: |
          mkdir -p target/dist
          cargo deb -p xtools-host --no-build --output target/dist/xtools_${{ steps.get_version.outputs.VERSION }}_amd64.deb
          cargo generate-rpm -p crates/xtools-host -o target/dist/xtools-${{ steps.get_version.outputs.VERSION }}-1.x86_64.rpm

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            target/dist/*.deb
            target/dist/*.rpm

  build-windows:
    name: Build Windows Packages
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binaries
        run: cargo build --workspace --release

      - name: Extract Version
        id: get_version
        shell: pwsh
        run: |
          $refName = $env:GITHUB_REF_NAME
          if ($refName -match '^v(?<ver>.+)$') {
            $ver = $Matches.ver
          } elseif ($refName) {
            $ver = $refName
          } else {
            $ver = "0.2.4"
          }
          "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Package Windows ZIP & Installer
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.VERSION }}"
          $distDir = "target/dist"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          $staging = "target/xtools-staging"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          
          Copy-Item "target/release/xtools-host.exe" -Destination $staging
          Copy-Item "target/release/xtools-time.exe" -Destination $staging
          Copy-Item "target/release/xtools-json.exe" -Destination $staging
          Copy-Item "target/release/xtools-trans.exe" -Destination $staging
          Copy-Item "README.md" -Destination $staging -ErrorAction SilentlyContinue
          Copy-Item "LICENSE" -Destination $staging -ErrorAction SilentlyContinue
          
          $zipPath = "$distDir/xtools-$ver-windows-x86_64.zip"
          Compress-Archive -Path "$staging/*" -DestinationPath $zipPath -Force
          Write-Host "Created $zipPath"

          # Compile Inno Setup Installer (.exe setup)
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            $isccCmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($isccCmd) { $iscc = $isccCmd.Source }
          }
          if (-not (Test-Path -LiteralPath $iscc)) {
            Write-Host "Installing Inno Setup via Chocolatey..."
            choco install innosetup --no-progress -y
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          
          Write-Host "Compiling Windows installer with $iscc"
          & $iscc "/DVERSION=$ver" scripts/windows-installer.iss
          Get-ChildItem -Path $distDir

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            target/dist/*.zip
            target/dist/*.exe
  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
