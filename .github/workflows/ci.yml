name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    name: Check & Test (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libfontconfig1-dev \
            libwayland-dev \
            wayland-protocols \
            gobject-introspection \
            valac \
            meson \
            ninja-build \
            xvfb \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Install gtk4-layer-shell
        run: |
          git clone --depth 1 https://github.com/wmww/gtk4-layer-shell.git
          cd gtk4-layer-shell
          meson setup build --prefix=/usr \
            -Dexamples=false \
            -Ddocs=false \
            -Dtests=false \
            -Dvapi=false \
            -Dintrospection=false
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig
          cd ..
          rm -rf gtk4-layer-shell

      - name: Check Workspace
        run: cargo check --workspace

      - name: Test Workspace
        run: xvfb-run --auto-servernum cargo test --workspace

  windows-tools:
    name: Test & Build Slint Tools (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Test Shared UI
        run: cargo test -p xtools-ui

      - name: Build Slint Tools
        run: cargo build -p xtools-time -p xtools-json -p xtools-trans --release

      - name: Smoke Test Windows Singleton Tools
        shell: pwsh
        run: ./scripts/windows-singleton-smoke.ps1 -TargetDir "$env:GITHUB_WORKSPACE/target/release"
